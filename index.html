  <script>
    // The layout's footer lays out the slide's sources and number too. Credits, and on
    // full-screen slides the sources, go to a .corner in the top right instead.
    document.querySelectorAll('.remark-slide-content').forEach(slide => {
      const footer = slide.querySelector(':scope > .footer');
      const sources = slide.querySelectorAll('.sources');
      const corner = document.createElement('div');
      corner.className = 'corner';
      corner.append(...slide.querySelectorAll('.credit'));
      if (footer) {
        (slide.classList.contains('full-screen') ? corner : footer).append(...sources);
        footer.append(slide.querySelector('.remark-slide-number'));
      }
      if (corner.childElementCount) slide.append(corner);
    });
  </script>
